name: Sync And Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # ~北京时间 02:00;GitHub 排队常晚 30~70 分钟
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "site/**"
      - "sources/**"
      - "workers/**"
      - "registry.json"
      - "package.json"
      - ".github/workflows/sync-and-deploy.yml"

concurrency:
  group: youmind-hub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  YOUMIND_LOCALE: zh-CN
  YOUMIND_MAX_CACHE_AGE_HOURS: "12"
  YOUMIND_ALLOW_STALE_CACHE_ON_ERROR: "1"

jobs:
  # Auto-discover sources so adding a model = add a config, no workflow edit.
  discover:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.list.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "sources=$(node scripts/list-sources.mjs)" >> "$GITHUB_OUTPUT"

  # One isolated matrix instance per source. fail-fast:false => a single source
  # failing never blocks the others or the final site build/deploy.
  fetch-sync:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.discover.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      # Materialize this source's Feishu base/table from a secret (kept out of git).
      - name: Write Feishu table map
        env:
          FEISHU_TABLES_JSON: ${{ secrets.FEISHU_TABLES_JSON }}
        run: |
          SLUG="${{ matrix.source }}"
          node -e 'const fs=require("fs");const slug=process.argv[1];const map=JSON.parse(process.env.FEISHU_TABLES_JSON||"{}");const t=map[slug];if(t){fs.mkdirSync("sources/"+slug,{recursive:true});fs.writeFileSync("sources/"+slug+"/.local.json",JSON.stringify({baseToken:t.baseToken,tableId:t.tableId},null,2)+"\n");console.log("feishu table set for "+slug);}else{console.log("no feishu table configured for "+slug);}' "$SLUG"

      - name: Restore prompt cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/${{ matrix.source }}
          key: hub-cache-${{ runner.os }}-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: |
            hub-cache-${{ runner.os }}-${{ matrix.source }}-

      - name: Fetch prompts
        env:
          YOUMIND_SOURCE: ${{ matrix.source }}
          YOUMIND_CACHE_DIR: ${{ github.workspace }}/.cache/${{ matrix.source }}
        run: node scripts/fetch-prompts.mjs

      # Soft-fail: a missing/unconfigured table or a transient Feishu error must
      # not turn the whole run red — the site still builds from the snapshot.
      - name: Sync to Feishu (Open API)
        continue-on-error: true
        env:
          YOUMIND_SOURCE: ${{ matrix.source }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          if [ -z "$FEISHU_APP_ID" ]; then echo "No FEISHU_APP_ID; skipping sync for ${{ matrix.source }}."; exit 0; fi
          if [ ! -f "sources/${{ matrix.source }}/.local.json" ]; then echo "No Feishu table for ${{ matrix.source }}; skipping sync."; exit 0; fi
          node scripts/sync-feishu-api.mjs || echo "Feishu sync failed for ${{ matrix.source }} (continuing)"

      - name: Build site data
        env:
          YOUMIND_SOURCE: ${{ matrix.source }}
          SITE_SOURCE_MODE: auto
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node scripts/build-one.mjs

      - name: Upload site data
        uses: actions/upload-artifact@v4
        with:
          name: site-data-${{ matrix.source }}
          path: dist/data/${{ matrix.source }}.json
          if-no-files-found: error

      - name: Save prompt cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/${{ matrix.source }}
          key: hub-cache-${{ runner.os }}-${{ matrix.source }}-${{ github.run_id }}

  # Aggregate all per-source artifacts into one site and deploy once.
  build-deploy:
    needs: [discover, fetch-sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      # Download to a staging dir then flatten, so we are robust to whether
      # upload-artifact@v4 stored the file as "<slug>.json" or "dist/data/<slug>.json".
      - name: Download all site data
        uses: actions/download-artifact@v4
        with:
          pattern: site-data-*
          merge-multiple: true
          path: _artifacts

      - name: Flatten artifacts into dist/data
        run: |
          mkdir -p dist/data
          find _artifacts -type f -name '*.json' -exec mv -t dist/data {} +
          rm -rf _artifacts
          echo "data files:"; ls -1 dist/data

      # assemble-site runs the quality gate (fails if any enabled source has 0 prompts).
      - name: Assemble site
        run: node scripts/assemble-site.mjs

      - name: Upload data to R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          for f in dist/data/*.json; do
            npx wrangler r2 object put "youmind-hub-data/data/$(basename "$f")" --remote --file "$f" --content-type "application/json"
          done

      - name: Deploy data-gate Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/data-gate/wrangler.toml

      # Data is served from R2 via the Worker; keep only shell + registry + pages on Pages.
      - name: Strip data from Pages artifact
        run: rm -rf dist/data

      - name: Ensure Cloudflare Pages project exists
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create youmind-hub --production-branch main 2>/dev/null || echo "Pages project already exists"

      - name: Deploy Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name youmind-hub --branch main --commit-dirty=true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
